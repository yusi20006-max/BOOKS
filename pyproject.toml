[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "books"
version = "0.1.0"
description = "Persian-first offline-first personal library"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.38,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
books = "books.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
