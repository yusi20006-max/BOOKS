name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  test:
    name: Lint + tests + smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          ruff check src tests 2>&1 | tee "$RUNNER_TEMP/ruff.log"
          exit ${PIPESTATUS[0]}

      - name: Report lint diagnostics
        if: steps.lint.outcome == 'failure' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 40 --body "```text
          $(cat "$RUNNER_TEMP/ruff.log")
          ```"

      - name: Fail on lint
        if: steps.lint.outcome == 'failure'
        run: exit 1
      - name: Tests
        run: python -m pytest -q
      - name: Offline smoke
        env:
                    BOOKS_DB_PATH: ${{ runner.temp }}/books.sqlite3
        run: |
          python -c "from books.config import load_settings; from books.db import Database; s=load_settings(); assert Database(s.db_path).migrate() == 7"
          python -m books.health

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag books:ci .
