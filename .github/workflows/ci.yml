name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  test:
    name: Lint + tests + smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Lint
        run: |
          set -o pipefail
          ruff check src tests 2>&1 | tee "$RUNNER_TEMP/ruff.log"

      - name: Report lint diagnostics
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/40/comments" \
            -f body="$(cat "$RUNNER_TEMP/ruff.log")"
      - name: Tests
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      - name: Report test diagnostics
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/40/comments" \
            -f body="$(cat "$RUNNER_TEMP/pytest.log")"
      - name: Offline smoke
        env:
                    BOOKS_DB_PATH: ${{ runner.temp }}/books.sqlite3
        run: |
          python -c "from books.config import load_settings; from books.db import Database; s=load_settings(); assert Database(s.db_path).migrate() == 8"
          python -m books.health

      - name: Release package and runtime gate
        run: sh scripts/release-gate.sh

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag books:ci .
